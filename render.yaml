services:
  - type: web
    name: fenemof
    runtime: python
    buildCommand: ""
    startCommand: python server/server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
